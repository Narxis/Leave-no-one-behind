# Builds the desktop app.
# - Windows: on every push to prod (except relay and docs), the executable is
#   published in a GitHub Release. The files always have the same name, so
#   this link always downloads the latest version:
#     https://github.com/<repo>/releases/latest/download/LNOB-Setup.exe
#     https://github.com/<repo>/releases/latest/download/LNOB-Portable.exe
#   By default the Release is created in this repo. To publish it in another
#   repo (public, so players don't need a GitHub account), set the
#   RELEASE_REPO variable (e.g. Narxis/LNOB-app) and the RELEASE_TOKEN
#   secret (token with the "Contents: write" permission on that repo).
# - macOS and Linux: on demand from the Actions tab or on a v* tag,
#   downloadable from the run artifacts.
name: App de bureau

on:
  workflow_dispatch:
  push:
    branches: [ prod ]
    tags: [ "v*" ]
    paths-ignore:
      - 'relay/**'
      - '**.md'
      - '.github/workflows/relay.yml'
      - '.github/workflows/wiki-tableaux.yml'

# Only one publication at a time: the most recent one wins
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: 'npm'
    - run: npm ci
    - run: npm test
    # No signing certificate for now: Windows shows
    # "Windows protected your PC" on first launch
    # ("More info" then "Run anyway")
    # bash: PowerShell splits the -c.extraMetadata.version option
    - run: npx electron-builder --win --publish never -c.extraMetadata.version=1.0.${{ github.run_number }}
      shell: bash
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false
    - uses: actions/upload-artifact@v5
      with:
        name: lnob-windows
        path: |
          dist/LNOB-Setup.exe
          dist/LNOB-Portable.exe
        if-no-files-found: error
    - name: Publier la Release
      if: github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v')
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        REPO: ${{ vars.RELEASE_REPO || github.repository }}
        TAG: app-1.0.${{ github.run_number }}
      run: |
        notes="Version construite depuis le commit ${GITHUB_SHA::7} de ${{ github.repository }}.

        - **LNOB-Setup.exe** : installeur Windows (raccourci dans le menu Démarrer, mises à jour en réinstallant par-dessus).
        - **LNOB-Portable.exe** : rien à installer, se lance directement (démarrage un peu plus lent).

        Les parties, réglages et éditeurs sont gardés dans le dossier de données de l'utilisateur, hors du dossier de l'app : ils ne sont pas perdus en changeant de version.

        Au premier lancement, Windows peut afficher « Windows a protégé votre ordinateur » : cliquer sur « Informations complémentaires » puis « Exécuter quand même »."
        # The commit only exists in this repo
        target=()
        [ "$REPO" = "${{ github.repository }}" ] && target=(--target "$GITHUB_SHA")
        gh release create "$TAG" dist/LNOB-Setup.exe dist/LNOB-Portable.exe \
          --repo "$REPO" "${target[@]}" --latest \
          --title "LNOB 1.0.${{ github.run_number }}" --notes "$notes"

  other:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: 'npm'
    - run: npm ci
    - run: npm test
    # No signing certificate for now: macOS will show a
    # warning on first launch
    - run: npx electron-builder --publish never
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false
    - uses: actions/upload-artifact@v5
      with:
        name: lnob-${{ matrix.os }}
        path: |
          dist/*.dmg
          dist/*.AppImage
        if-no-files-found: error
