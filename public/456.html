    // generate Random tile map
    function generateTileMap(rows, cols) {
        numRows = rows;
        numCols = cols;
        const tileMap = [];
        for (let i = 0; i < numRows; i++) {
            const row = [];
            for (let j = 0; j < numCols; j++) {
                let randomTileType = Math.floor(Math.random() * textures.length).toString();
                row.push(randomTileType);
            }
            tileMap.push(row);
        }
        return tileMap;
    }

    function createIsoGrid() {

        const TILE_WIDTH = tileSize;
        const TILE_WIDTH_HALF = TILE_WIDTH / 2;
        const TILE_HEIGHT = tileSize;
        const TILE_HEIGHT_HALF = TILE_HEIGHT / 2;
        const textStyle = new TextStyle({
            fontFamily: 'sans-serif',
            fontSize: tileSize/3,
            fill: ['#96c1d3'], // gradient
        });

        for (let row = 0; row <= numRows; row++) {
            for (let col = 0; col <= numCols; col++) {
                if (row === numRows && col === numCols) continue;
                let tile = new Graphics();
                tile.beginFill((row + col) % 2 === 0 ? "#0a2647" : "#0d2a4c");
                tile.lineStyle(1, "#205295");

                let tileOriginX = (col-row) * TILE_WIDTH + (numRows * (numRows/numCols) * .7) * TILE_WIDTH;
                let tileOriginY = (col+row) * TILE_HEIGHT_HALF + TILE_HEIGHT_HALF;

                let northX = tileOriginX;
                let northY = tileOriginY;
                let eastX = tileOriginX + TILE_WIDTH;
                let eastY = tileOriginY + TILE_HEIGHT_HALF;
                let southX = tileOriginX;
                let southY = tileOriginY + TILE_HEIGHT;
                let westX = tileOriginX - TILE_WIDTH;
                let westY = tileOriginY + TILE_HEIGHT_HALF;

                let pointsPolygon = [
                    northX, northY,
                    eastX, eastY,
                    southX, southY,
                    westX, westY
                ];

                // Inset 1 to prevent overlapping
                let pointsPolygonHitArea = [
                    northX, northY+1,
                    eastX-1, eastY,
                    southX, southY-1,
                    westX+1, westY
                ];

                // Draw from North
                tile.drawPolygon(pointsPolygon);
                tile.endFill();
                tile.blockedPath = [];
                tile.playerIdOnIt = -1;
                tile.foregroundProp = false;
                tile.col = col;
                tile.row = row;
                if (row === numRows || col === numCols) {
                    let text = '';
                    if (row === numRows) {
                        text = String.fromCharCode(96 + numCols-col).toUpperCase();
                    }
                    else if (col === numCols) {
                        text = (numRows-row).toString();
                    }

                    let tileText = new Text(text,textStyle);
                    tileText.x = northX - TILE_WIDTH_HALF/4;
                    tileText.y = northY + TILE_HEIGHT_HALF/2;
                    tile.addChild(tileText);

                } else {
                    let marker = tileMap[row][col];
                    let spawnable = marker.startsWith('@');
                    let textureX = Math.round(northX - TILE_WIDTH);
                    let textureY = Math.round(northY - TILE_HEIGHT * 3);

                    if (spawnable) {
                        marker = marker.replace(/^@/, '');
                    }

                    // IF MARKER HAS @ prefix, try to spawn a player token
                    tile.marker = marker;
                    tile.interactive = true;
                    tile
                        .on('click', onTileClick, tile)
                        .on('pointerover', onTileOver, tile)
                        .on('pointerout', onTileOut, tile)
                    tile.hitArea = new Polygon(pointsPolygonHitArea);

                    let texture = getTextureInfosFromMarker(tile.marker);

                    let firstForegroundIndex = texture.images.findIndex(el => el.foreground === true);

                    for (let i=0; i < texture.images.length; i++)
                    {
                        let image = texture.images[i];
                        let tileTexture = new Sprite(image.texture);
                        tileTexture.x = textureX;
                        tileTexture.y = textureY;
                        tileTexture.width = TILE_WIDTH * 2;
                        tileTexture.height = TILE_WIDTH * 4;
                        tileTexture.hitArea = new Polygon(0,0,0,0,0,0);
                        tileTexture.isForeground = image.foreground;
                        tile.texturePos = [textureX, textureY];
                        tile.textureX = textureX;
                        tile.textureY = textureY;
                        tile.blockedPaths = texture.blockedPath;
                        tile.addChild(tileTexture);

                        if (spawnable
                            && (i === firstForegroundIndex-1 || i === texture.images.length+firstForegroundIndex)) {
                            let player = players.splice(0,1);
                            if (player.length) {
                                player = player[0];
                                let token = getTokenInfosFromName(player.race);
                                let playerToken = new AnimatedSprite(token.textures.idle_N);
                                playerToken.animationSpeed = .05;
                                // playerToken.autoUpdate = true;
                                playerToken.name = token.name;
                                playerToken.uid = player.id
                                playerToken.x = textureX;
                                playerToken.y = textureY;
                                playerToken.width = TILE_WIDTH * 2;
                                playerToken.height = TILE_WIDTH * 4;
                                playerToken.hitArea = new Polygon(0,0,0,0,0,0);
                                playerToken.play();
                                tokenSet.push(playerToken);
                                tile.playerIdOnIt = player.id;
                                tile.addChild(playerToken);
                            }
                        }
                    }
                }
                tileSet.push(tile);
                stage.addChild(tile);
            }
        }
    }

    async function onTileClick() {
        if (!tileTarget) {
            tileTarget = this;
            this.alpha = .8;
        }
        else if (tileTarget.col === this.col && tileTarget.row === this.row) {
            this.alpha = 1;
            tileTarget = null;
        }
        else {
            if (isValidDestination(this)) {
                moveItemOnTile(tileTarget ,this)
                tileTarget.alpha = 1;
                this.alpha = 1;
                tileTarget = null;
            }
        }

    }

    function isValidDestination(tile) {

        if (tileTarget.col === tile.col && tileTarget.row === tile.row)
            return false;
        if (tile.playerIdOnIt > 0)
            return false;
        if (tile.blockedPaths.length === 4)
            return false;

        return true;
    }

    async function moveItemOnTile(from, to) {
        let path = search(from,to).splice(1);
        let playerToken = tokenSet.find(el => el.uid === from.playerIdOnIt);
        let prevStep = {
            x: from.textureX,
            y: from.textureY,
        }
        let prevTile = from;
        let prevAnim;
        from.addChild(playerToken);
        let moveTimeStep = tileSize / .4;

        if (playerToken && path)
        {
            for (let step of path)
            {
                let tile = tileSet.find(el => el.col === step.x && el.row === step.y);
                let swapChildren = [...tile.children];
                let firstForeGroundChildIndex = swapChildren.findIndex(el => el.isForeground === true);

                let updateChildren = () => {
                    if (firstForeGroundChildIndex === -1) {
                        tile.addChild(playerToken);
                    }
                    else {
                        tile.removeChildren();
                        for (let i=0; i<swapChildren.length; i++) {
                            tile.addChild(swapChildren[i]);
                            if (i === firstForeGroundChildIndex - 1) {
                                tile.addChild(playerToken);
                            }
                        }
                    }
                    prevTile.removeChild(playerToken)
                };

                // North and West still clipping...

                if (prevStep.x < tile.textureX && prevStep.y < tile.textureY) {
                    updateChildren();
                    if (prevAnim !== 'E'){
                        playerToken.textures = getTokenInfosFromName(playerToken.name).textures.move_E;
                        playerToken.play();
                    }
                    prevAnim = 'E';
                    while (playerToken.x < tile.textureX && playerToken.y < tile.textureY) {
                        playerToken.x = playerToken.x + 2;
                        playerToken.y = playerToken.y + 1;
                        await sleep(moveTimeStep);
                    }
                }
                if (prevStep.x > tile.textureX && prevStep.y > tile.textureY) {
                    if (prevAnim !== 'W') {
                        playerToken.textures = getTokenInfosFromName(playerToken.name).textures.move_W;
                        playerToken.play();
                    }
                    prevAnim = 'W';
                    while (playerToken.x > tile.textureX && playerToken.y > tile.textureY) {
                        playerToken.x = playerToken.x - 2;
                        playerToken.y = playerToken.y - 1;
                        await sleep(moveTimeStep);
                    }
                    updateChildren();
                }
                if (prevStep.x < tile.textureX && prevStep.y > tile.textureY) {
                    if (prevAnim !== 'N') {
                        playerToken.textures = getTokenInfosFromName(playerToken.name).textures.move_N;
                        playerToken.play();
                    }
                    prevAnim = 'N';
                    while (playerToken.x < tile.textureX && playerToken.y > tile.textureY) {
                        playerToken.x = playerToken.x + 2;
                        playerToken.y = playerToken.y - 1;
                        await sleep(moveTimeStep);
                    }
                    updateChildren();
                }
                if (prevStep.x > tile.textureX && prevStep.y < tile.textureY) {
                    updateChildren();
                    if (prevAnim !== 'S') {
                        playerToken.textures = getTokenInfosFromName(playerToken.name).textures.move_S;
                        playerToken.play();
                    }
                    prevAnim = 'S';
                    while (playerToken.x > tile.textureX && playerToken.y < tile.textureY) {
                        playerToken.x = playerToken.x - 2;
                        playerToken.y = playerToken.y + 1;
                        await sleep(moveTimeStep);
                    }
                }
                prevStep = {x: tile.textureX, y: tile.textureY}
            }

            playerToken.textures = getTokenInfosFromName(playerToken.name).textures['idle_' + prevAnim];
            from.playerIdOnIt = -1;
            to.playerIdOnIt = playerToken.uid;
            await sleep(1500);
        }
        console.log(`Moving from [${from.col},${from.row}] to [${to.col},${to.row}]`);
    }

    /**
     * Path finding spaghetti
     */

    let pfCols = numCols; //columns in the grid
    let pfRows = numRows; //rows in the grid

    let grid = new Array(pfCols); //array of all the grid points

    let openSet = []; //array containing unevaluated grid points
    let closedSet = []; //array containing completely evaluated grid points

    let pfStart; //starting grid point
    let pfEnd; // ending grid point
    let path = [];


    // Manhattan distance
    function heuristic(position0, position1) {
        let d1 = Math.abs(position1.x - position0.x);
        let d2 = Math.abs(position1.y - position0.y);

        return d1 + d2;
    }

    //constructor function to create all the grid points as objects containind the data for the points
    function GridPoint(x, y, g=0, b) {
        this.x = x; //x location of the grid point
        this.y = y; //y location of the grid point
        this.f = 0; //total cost function
        this.g = g; //cost function from start to the current grid point
        this.h = 0; //heuristic estimated cost function from current grid point to the goal
        this.neighbors = []; // neighbors of the current grid point
        this.parent = undefined; // immediate source of the current grid point

        // update neighbors array for a given grid point
        this.updateNeighbors = function (grid) {
            let i = this.x;
            let j = this.y;
            let blockedPath = getTileFromTileSet(i,j).blockedPaths;

            if (i < pfCols - 1 ) { // East Neighbor
                if (!blockedPath.includes('E') && !getTileFromTileSet(i + 1,j).blockedPaths.includes('W'))
                    this.neighbors.push(grid[i + 1][j]);
            }
            if (i > 0) { // West Neighbor
                if (!blockedPath.includes('W') && !getTileFromTileSet(i - 1,j).blockedPaths.includes('E'))
                    this.neighbors.push(grid[i - 1][j]);
            }
            if (j < pfRows - 1) { // South Neighbor
                if (!blockedPath.includes('S') && !getTileFromTileSet(i,j + 1).blockedPaths.includes('N'))
                    this.neighbors.push(grid[i][j + 1]);
            }
            if (j > 0) { // North Neighbor
                if (!blockedPath.includes('N') && !getTileFromTileSet(i,j - 1).blockedPaths.includes('S'))
                    this.neighbors.push(grid[i][j - 1]);
            }
        };
    }

    function init(startTile, endTile) {

        pfCols = numCols;
        pfRows = numRows;

        grid = new Array(pfCols);

        openSet = []; //array containing unevaluated grid points
        closedSet = []; //array containing completely evaluated grid points

        path = [];
        //making a 2D array
        for (let i = 0; i < pfCols; i++) {
            grid[i] = new Array(pfRows);
        }

        for (let i = 0; i < pfCols; i++) {
            for (let j = 0; j < pfRows; j++) {
                grid[i][j] = new GridPoint(i, j); // Third parameter here for cost malus
            }
        }

        for (let i = 0; i < pfCols; i++) {
            for (let j = 0; j < pfRows; j++) {
                grid[i][j].updateNeighbors(grid);
            }
        }

        pfStart = grid[startTile.col][startTile.row];
        pfEnd = grid[endTile.col][endTile.row];

        openSet.push(pfStart);
    }

    //A star search implementation

    function search(startTile, endTile) {
        init(startTile, endTile);
        while (openSet.length > 0) {
            let lowestIndex = 0;
            for (let i = 0; i < openSet.length; i++) {
                if (openSet[i].f < openSet[lowestIndex].f) {
                    lowestIndex = i;
                }
            }
            let current = openSet[lowestIndex];

            if (current === pfEnd) {
                let temp = current;
                path.push(temp);
                while (temp.parent) {
                    path.push(temp.parent);
                    temp = temp.parent;
                }
                // return the traced path
                return path.reverse();
            }

            //remove current from openSet
            openSet.splice(lowestIndex, 1);
            //add current to closedSet
            closedSet.push(current);

            let neighbors = current.neighbors;

            for (let i = 0; i < neighbors.length; i++) {
                let neighbor = neighbors[i];

                if (!closedSet.includes(neighbor)) {
                    let possibleG = current.g + 1;
                    if (!openSet.includes(neighbor)) {
                        openSet.push(neighbor);
                    } else if (possibleG >= neighbor.g) {
                        continue;
                    }

                    neighbor.g = neighbor.g + possibleG; // Add base G for malus path
                    neighbor.h = heuristic(neighbor, pfEnd);
                    neighbor.f = neighbor.g + neighbor.h;
                    neighbor.parent = current;
                }
            }
        }

        //no solution by default
        return [];
    }

    app.start();
