<head>
  <link rel="stylesheet" href="assets\css\parallaxe.css">
</head>
<body>
  <div class="card">
    <div class="wrap wrap--1">
      <div class="mod-stats">
        <div class="tab tab-moteurs">
          <div class="container moteurs" data-size="400" data-value="100" data-arrow="d"></div>
          <button class="mod-b tab-moins" id="moins-mot">-</button>
          <div class="modform form-mot">
            <input type="text" class="form-input" placeholder="1-100">
          </div>
          <button class="mod-b tab-plus" id="plus-mot">+</button>
          <div class="tab-txt">Moteurs</div>
        </div>
        <div class="tab tab-scan">
          <div class="container scan" data-size="400" data-value="100" data-arrow="d"></div>
          <button class="mod-b tab-moins" id="moins-scan">-</button>
          <div class="modform form-scan">
            <input type="text" class="form-input" placeholder="1-100">
          </div>
          <button class="mod-b tab-plus" id="plus-scan">+</button>
          <div class="tab-txt">Scanner de surface</div>
        </div>
        <div class="tab tab-detect">
          <div class="container detect" data-size="400" data-value="100" data-arrow="d"></div>
          <button class="mod-b tab-moins" id="moins-detect">-</button>
          <div class="modform form-detect">
            <input type="text" class="form-input" placeholder="1-100">
          </div>
          <button class="mod-b tab-plus" id="plus-detect">+</button>
          <div class="tab-txt">Détecteur de proximité</div>
        </div>
        <div class="tab tab-o2">
          <div class="container o2" data-size="400" data-value="100" data-arrow="d"></div>
          <button class="mod-b tab-moins" id="moins-o2">-</button>
          <div class="modform form-o2">
            <input type="text" class="form-input" placeholder="1-100">
          </div>
          <button class="mod-b tab-plus" id="plus-o2">+</button>
          <div class="tab-txt">Oxygène</div>
        </div>
        <div class="tab tab-elec">
          <div class="container elec" data-size="400" data-value="100" data-arrow="d"></div>
          <button class="mod-b tab-moins" id="moins-elec">-</button>
          <div class="modform form-elec">
            <input type="text" class="form-input" placeholder="1-100">
          </div>
          <button class="mod-b tab-plus" id="plus-elec">+</button>
          <div class="tab-txt">Électricité</div>
        </div>
        <div class="tab tab-grav">
          <div class="container grav" data-size="400" data-value="100" data-arrow="d"></div>
          <button class="mod-b tab-moins" id="moins-grav">-</button>
          <div class="modform form-grav">
            <input type="text" class="form-input" placeholder="1-100">
          </div>
          <button class="mod-b tab-plus" id="plus-grav">+</button>
          <div class="tab-txt">Gravité artificielle</div>
        </div>
      </div>
      <div class="container-card container--1">
        <div class="bg-dot"></div>
        <div class="card-text">Regarde Kardo j'ai fait les tab</div>
      </div>
    </div>
  </div>
</body>

<script src="assets\js\parallaxe.js"></script>
<script src="assets\js\dial\moteurs.js"></script>
<script src="assets\js\dial\scan.js"></script>
<script src="assets\js\dial\detect.js"></script>
<script src="assets\js\dial\o2.js"></script>
<script src="assets\js\dial\elec.js"></script>
<script src="assets\js\dial\grav.js"></script>
